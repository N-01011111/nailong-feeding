<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFF7DE">
  <meta name="description" content="一个软萌的奶龙喂养互动小网页：投喂蛋糕、冰淇淋、水果和奶茶，照顾奶龙的饥饿值与开心值。">
  <title>奶龙的小饭桌 · 投喂互动</title>

  <!--
    ============================================================
    奶龙喂养互动页
    · 单文件：原生 HTML + CSS + JavaScript，无任何外部框架 / CDN
    · 4 张奶龙图片均来自用户上传，仅通过 img 标签展示，图片位置已替换为图床永久直链
    · 图片顺序：默认 → 开心 → 委屈饥饿 → 捧腹大笑
    ============================================================
  -->

  <style>
    /* ===================== 基础变量与重置 ===================== */
    :root {
      --bg-cream: #FFF7DE;
      --paper: #FFFDF8;
      --ink: #6B4728;
      --ink-soft: #A17E54;
      --ink-light: #C0A47C;
      --line: #F1D9A8;
      --yellow: #FFD447;
      --yellow-deep: #F5B52D;
      --orange: #F09A32;
      --pink: #F47EA4;
      --pink-soft: #FFD8E2;
      --mint: #9FE0C4;
      --radius-lg: 28px;
      --radius-md: 20px;
      --shadow-soft: 0 18px 40px rgba(186, 139, 55, 0.11);
      --shadow-card: 0 5px 0 rgba(244, 223, 177, 0.72), 0 14px 26px rgba(186, 139, 55, 0.08);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "HarmonyOS Sans SC", sans-serif;
      background-color: var(--bg-cream);
      background-image:
        radial-gradient(circle at 7% 2%, rgba(255, 225, 139, 0.62), transparent 27%),
        radial-gradient(circle at 95% 9%, rgba(255, 208, 190, 0.4), transparent 28%),
        radial-gradient(circle at 50% 102%, rgba(255, 238, 166, 0.62), transparent 36%),
        radial-gradient(rgba(228, 173, 78, 0.13) 1.2px, transparent 1.3px);
      background-size: auto, auto, auto, 24px 24px;
      background-attachment: fixed;
      overflow-x: hidden;
    }

    button {
      font: inherit;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    img {
      display: block;
      max-width: 100%;
    }

    /* ===================== 页面氛围装饰 ===================== */
    .ambient {
      position: fixed;
      z-index: 0;
      border-radius: 50%;
      filter: blur(48px);
      pointer-events: none;
      opacity: 0.55;
    }

    .ambient-a {
      top: -130px;
      left: -120px;
      width: 360px;
      height: 360px;
      background: #FFE396;
    }

    .ambient-b {
      right: -120px;
      bottom: -110px;
      width: 330px;
      height: 330px;
      background: #FFD8DF;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(1080px, calc(100% - 36px));
      margin: 0 auto;
      padding: 26px 0 30px;
    }

    /* ===================== 顶部标题栏 ===================== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 54px;
      height: 54px;
      border: 3px solid #FFFDF7;
      border-radius: 19px;
      background: linear-gradient(150deg, #FFF1AB, #FFD246);
      box-shadow: 0 5px 0 #EDB62F, 0 12px 22px rgba(200, 146, 38, 0.18);
      font-size: 27px;
      transform: rotate(-5deg);
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-eyebrow {
      margin: 0 0 2px;
      color: #B58C4C;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 2.1px;
    }

    h1 {
      margin: 0;
      color: #63401F;
      font-size: clamp(25px, 3.2vw, 35px);
      line-height: 1.12;
      font-weight: 900;
      letter-spacing: 0.4px;
    }

    .title-hl {
      position: relative;
      z-index: 0;
      white-space: nowrap;
    }

    .title-hl::after {
      content: "";
      position: absolute;
      z-index: -1;
      right: -3px;
      bottom: 3px;
      left: -3px;
      height: 10px;
      border-radius: 999px;
      background: #FFE27C;
      opacity: 0.82;
      transform: rotate(-1deg);
    }

    .brand-sub {
      margin: 4px 0 0;
      color: var(--ink-soft);
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .reset-btn {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 7px;
      padding: 10px 16px;
      border: 2px solid #F1D8A6;
      border-radius: 999px;
      background: rgba(255, 253, 246, 0.92);
      box-shadow: 0 5px 0 #EEDCB4, 0 8px 18px rgba(184, 135, 55, 0.08);
      color: #795532;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .reset-btn:hover {
      background: #FFFEF9;
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #EEDCB4, 0 12px 22px rgba(184, 135, 55, 0.12);
    }

    .reset-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #EEDCB4, 0 4px 8px rgba(184, 135, 55, 0.08);
    }

    .reset-btn:focus-visible {
      outline: 3px solid #FFC247;
      outline-offset: 3px;
    }

    .reset-icon {
      display: inline-block;
      font-size: 17px;
      line-height: 1;
      transition: transform 0.35s ease;
    }

    .reset-btn:hover .reset-icon {
      transform: rotate(-150deg);
    }

    .reset-btn.is-spinning .reset-icon {
      animation: reset-spin 0.58s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes reset-spin {
      from { transform: rotate(0); }
      to { transform: rotate(-360deg); }
    }

    /* ===================== 数值面板 ===================== */
    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .stat-card {
      --stat-glow: #FFE0A3;
      --stat-color: #E78A28;
      position: relative;
      min-width: 0;
      overflow: hidden;
      padding: 13px 17px 11px;
      border: 2px solid #FFE8B8;
      border-radius: 22px;
      background: rgba(255, 253, 247, 0.94);
      box-shadow: var(--shadow-card);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .stat-card::before {
      content: "";
      position: absolute;
      top: -48px;
      right: -18px;
      width: 94px;
      height: 94px;
      border-radius: 50%;
      background: var(--stat-glow);
      opacity: 0.48;
      pointer-events: none;
    }

    .stat-hunger {
      --stat-glow: #FFE1A6;
      --stat-color: #E58A27;
    }

    .stat-happy {
      --stat-glow: #FFD6E1;
      --stat-color: #E96F97;
    }

    .stat-head {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .stat-name {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #80603E;
      font-size: 12.5px;
      font-weight: 900;
      white-space: nowrap;
    }

    .stat-icon {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 9px;
      background: var(--stat-glow);
      box-shadow: inset 0 -2px 0 rgba(160, 110, 40, 0.08);
      font-size: 14px;
    }

    .stat-value {
      display: flex;
      align-items: baseline;
      gap: 3px;
      font-variant-numeric: tabular-nums;
    }

    .stat-value strong {
      color: var(--stat-color);
      font-size: clamp(23px, 2.5vw, 30px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .stat-value small {
      color: #B9A181;
      font-size: 9px;
      font-weight: 800;
    }

    .bar {
      position: relative;
      overflow: hidden;
      height: 11px;
      border-radius: 999px;
      background: #FFF3D6;
      box-shadow: inset 0 2px 4px rgba(157, 114, 47, 0.08);
    }

    .bar-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 65%;
      border-radius: inherit;
      background: linear-gradient(90deg, #FFD66B, #FFAE3D);
      transition: width 0.3s linear, background 0.3s ease;
    }

    .stat-happy .bar-fill {
      background: linear-gradient(90deg, #FFB6CE, #FF7FA9);
    }

    .bar-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.5), transparent 58%);
    }

    .bar-ticks {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(255, 255, 255, 0.52) calc(10% - 1px) 10%);
      pointer-events: none;
    }

    .stat-foot {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-top: 7px;
    }

    .stat-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      background: #FFF5D8;
      color: #9A7542;
      font-size: 9.5px;
      font-weight: 900;
      letter-spacing: 0.2px;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .stat-happy .stat-badge {
      background: #FFF0F4;
      color: #C46884;
    }

    .stat-note {
      overflow: hidden;
      color: #B9A27E;
      font-size: 9px;
      font-weight: 600;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .stat-card.is-low {
      border-color: #FFC3A2;
      box-shadow: 0 5px 0 #F3D0B7, 0 12px 24px rgba(235, 124, 80, 0.12);
    }

    .stat-card.is-low .stat-badge {
      background: #FFE4D5;
      color: #D35F35;
    }

    .stat-card.is-low .bar-fill {
      background: linear-gradient(90deg, #FFB07D, #FF766D);
      animation: low-pulse 1.2s ease-in-out infinite;
    }

    .stat-card.is-low .stat-icon {
      animation: icon-shake 1.8s ease-in-out infinite;
    }

    .stat-card.is-low .stat-value strong {
      color: #DE6B47;
    }

    .gain-pop {
      position: absolute;
      z-index: 3;
      top: 36px;
      right: 18px;
      color: #4F9C75;
      font-size: 12px;
      font-weight: 900;
      text-shadow: 0 1px 0 #FFFDF8;
      pointer-events: none;
      animation: gain-float 0.95s ease-out forwards;
    }

    .gain-pop.for-happy {
      color: #D8678E;
    }

    @keyframes gain-float {
      0% { opacity: 0; transform: translateY(5px) scale(0.82); }
      22% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-27px) scale(1.02); }
    }

    @keyframes low-pulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.18) saturate(1.08); }
    }

    @keyframes icon-shake {
      0%, 100% { transform: rotate(0); }
      15% { transform: rotate(-8deg); }
      30% { transform: rotate(7deg); }
      45% { transform: rotate(-4deg); }
      60% { transform: rotate(3deg); }
    }

    /* ===================== 奶龙舞台 ===================== */
    .stage {
      position: relative;
      overflow: hidden;
      height: clamp(400px, 42vw, 470px);
      border: 3px solid #FFFEF8;
      border-radius: 34px;
      background:
        radial-gradient(circle at 50% 82%, rgba(255, 255, 255, 0.72), transparent 38%),
        linear-gradient(180deg, #FFF9E9 0%, #FFF5DD 55%, #FFEDC5 100%);
      box-shadow:
        0 10px 0 rgba(244, 216, 155, 0.72),
        0 22px 44px rgba(181, 137, 59, 0.13),
        inset 0 0 0 1px rgba(255, 255, 255, 0.62);
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image: radial-gradient(rgba(236, 187, 95, 0.15) 1.2px, transparent 1.3px);
      background-size: 22px 22px;
      mask-image: linear-gradient(180deg, transparent 0%, #000 45%, #000 100%);
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 45%, #000 100%);
      pointer-events: none;
    }

    .stage.is-celebrating {
      animation: stage-glow 1.1s ease-in-out 3;
    }

    @keyframes stage-glow {
      50% {
        box-shadow:
          0 10px 0 rgba(244, 216, 155, 0.72),
          0 0 0 7px rgba(255, 209, 98, 0.22),
          0 24px 52px rgba(231, 157, 53, 0.24);
      }
    }

    /* 太阳与云朵 */
    .sun {
      position: absolute;
      z-index: 0;
      top: 28px;
      right: 30px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #FFF4AA, #FFD15C 72%);
      box-shadow: 0 0 0 9px rgba(255, 216, 96, 0.18), 0 0 0 20px rgba(255, 229, 138, 0.1);
      animation: sun-breathe 4s ease-in-out infinite;
    }

    @keyframes sun-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .cloud {
      position: absolute;
      z-index: 0;
      width: 74px;
      height: 23px;
      border-radius: 999px;
      background: #FFFEF9;
      box-shadow: 0 6px 14px rgba(201, 158, 70, 0.08);
      opacity: 0.9;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: #FFFEF9;
    }

    .cloud::before {
      bottom: 5px;
      left: 10px;
      width: 32px;
      height: 32px;
    }

    .cloud::after {
      right: 13px;
      bottom: 3px;
      width: 22px;
      height: 22px;
    }

    .cloud-a {
      top: 106px;
      left: 6%;
      transform: scale(0.9);
      animation: cloud-a-drift 9s ease-in-out infinite;
    }

    .cloud-b {
      top: 67px;
      right: 19%;
      transform: scale(0.62);
      animation: cloud-b-drift 12s ease-in-out infinite;
    }

    @keyframes cloud-a-drift {
      0%, 100% { transform: scale(0.9) translateX(0); }
      50% { transform: scale(0.9) translateX(10px); }
    }

    @keyframes cloud-b-drift {
      0%, 100% { transform: scale(0.62) translateX(0); }
      50% { transform: scale(0.62) translateX(-9px); }
    }

    /* 草地小山 */
    .hill {
      position: absolute;
      z-index: 0;
      bottom: -56px;
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      pointer-events: none;
    }

    .hill-a {
      left: -18%;
      width: 80%;
      height: 150px;
      background: #FFE7AB;
      transform: rotate(3deg);
    }

    .hill-b {
      right: -22%;
      width: 78%;
      height: 132px;
      background: #FFDE91;
      transform: rotate(-4deg);
    }

    /* 胶带标签 */
    .stage-tape {
      position: absolute;
      z-index: 7;
      top: 20px;
      left: 22px;
      padding: 7px 13px;
      border: 1px dashed rgba(191, 149, 59, 0.35);
      border-radius: 5px;
      background: rgba(255, 241, 160, 0.92);
      box-shadow: 0 4px 10px rgba(172, 126, 47, 0.09);
      color: #8E672D;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.5px;
      transform: rotate(-2.5deg);
      pointer-events: none;
    }

    /* 气泡文字 */
    .bubble {
      position: absolute;
      z-index: 7;
      top: 22px;
      left: 50%;
      max-width: min(74%, 460px);
      padding: 11px 18px;
      border: 2px solid #F2D9A6;
      border-radius: 18px;
      background: var(--paper);
      box-shadow: 0 7px 0 rgba(242, 217, 166, 0.42), 0 12px 24px rgba(176, 130, 48, 0.12);
      color: #74502C;
      font-size: clamp(12.5px, 1.4vw, 15px);
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -6px) scale(0.92);
      transform-origin: 50% 100%;
      transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .bubble::after {
      content: "";
      position: absolute;
      bottom: -9px;
      left: 50%;
      width: 14px;
      height: 14px;
      border-right: 2px solid #F2D9A6;
      border-bottom: 2px solid #F2D9A6;
      border-radius: 0 0 4px 0;
      background: var(--paper);
      transform: translateX(-50%) rotate(45deg);
    }

    .bubble.show {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    /* 满值彩蛋印章 */
    .egg-stamp {
      position: absolute;
      z-index: 8;
      right: 22px;
      bottom: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 92px;
      height: 92px;
      border: 2px dashed #F0C766;
      border-radius: 50%;
      background: #FFF7D6;
      box-shadow: 0 8px 20px rgba(196, 144, 55, 0.14);
      color: #A06B27;
      opacity: 0;
      pointer-events: none;
      transform: rotate(8deg) scale(0.4);
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .egg-stamp span {
      color: #B48B45;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .egg-stamp strong {
      font-size: 13px;
      font-weight: 900;
      line-height: 1.25;
      text-align: center;
    }

    .egg-stamp.show {
      opacity: 1;
      transform: rotate(8deg) scale(1);
    }

    /* 奶龙区域 */
    .pet-zone {
      position: absolute;
      z-index: 3;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      height: 80%;
      padding-bottom: 30px;
      pointer-events: none;
    }

    .pet-rug {
      position: absolute;
      bottom: 22px;
      left: 50%;
      width: min(68%, 520px);
      height: 48px;
      border: 2px dashed #F0D090;
      border-radius: 50%;
      background: #FFF0C3;
      box-shadow: inset 0 8px 16px rgba(223, 178, 85, 0.1);
      transform: translateX(-50%);
    }

    .pet-shadow {
      position: absolute;
      bottom: 36px;
      left: 50%;
      width: min(42%, 300px);
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(137, 95, 36, 0.22), transparent 70%);
      filter: blur(2px);
      transform: translateX(-50%);
    }

    .nailong-stack {
      position: relative;
      z-index: 2;
      width: min(94%, 570px);
      height: calc(100% - 26px);
      transform-origin: 50% 100%;
      animation: pet-bob 4s ease-in-out infinite;
    }

    .nailong-stack.is-bouncing {
      animation: pet-bounce 0.62s cubic-bezier(0.22, 0.9, 0.36, 1);
    }

    @keyframes pet-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes pet-bounce {
      0% { transform: translateY(0) scale(1); }
      25% { transform: translateY(-16px) scale(1.015, 0.975); }
      48% { transform: translateY(0) scale(0.978, 1.025); }
      68% { transform: translateY(-7px) scale(1.006, 0.994); }
      100% { transform: translateY(0) scale(1); }
    }

    .nailong-img {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      opacity: 0;
      transform: translateY(7px) scale(0.985);
      user-select: none;
      -webkit-user-drag: none;
      transition: opacity 0.32s ease, transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .nailong-img.is-active {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .stage-note {
      position: absolute;
      z-index: 5;
      bottom: 16px;
      left: 22px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(255, 252, 239, 0.72);
      color: #AD8C5E;
      font-size: 10px;
      font-weight: 700;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }

    .stage-note-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #EFC26A;
      box-shadow: 0 0 0 3px rgba(239, 194, 106, 0.2);
    }

    /* ===================== 投喂面板 ===================== */
    .feeding-panel {
      margin-top: 16px;
      padding: 16px 18px 14px;
      border: 2px solid #FFE8B7;
      border-radius: 28px;
      background: rgba(255, 253, 247, 0.94);
      box-shadow: 0 7px 0 rgba(245, 224, 177, 0.65), 0 16px 30px rgba(194, 148, 67, 0.09);
    }

    .panel-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .panel-kicker {
      margin: 0 0 2px;
      color: #C3A16E;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .panel-title h2 {
      margin: 0;
      color: #6D4A27;
      font-size: clamp(17px, 2.2vw, 21px);
      font-weight: 900;
      letter-spacing: 0.2px;
    }

    .panel-hint {
      margin: 0;
      color: #9C7B51;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.6;
      text-align: right;
    }

    .panel-hint span {
      color: #BCA27B;
      font-weight: 600;
    }

    .food-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .food-btn {
      --food-tint: #FFF3DB;
      --food-edge: #EED8AB;
      position: relative;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      overflow: hidden;
      padding: 11px 8px 10px;
      border: 2px solid #FFFDF8;
      border-radius: 20px;
      background: linear-gradient(180deg, #FFFDF8, var(--food-tint));
      box-shadow: 0 4px 0 var(--food-edge), 0 7px 14px rgba(177, 133, 54, 0.07);
      color: #6F4D2C;
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease;
    }

    .food-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.92), transparent 56%);
      pointer-events: none;
    }

    .food-btn:hover {
      transform: translateY(-4px) rotate(-0.3deg);
      box-shadow: 0 8px 0 var(--food-edge), 0 14px 22px rgba(177, 133, 54, 0.12);
    }

    .food-btn:active {
      transform: translateY(2px) scale(0.985);
      box-shadow: 0 2px 0 var(--food-edge), 0 4px 8px rgba(177, 133, 54, 0.07);
    }

    .food-btn:focus-visible {
      outline: 3px solid #FFC247;
      outline-offset: 3px;
    }

    .food-btn.is-feeding {
      animation: food-press 0.3s ease;
    }

    @keyframes food-press {
      0% { transform: scale(1); }
      40% { transform: scale(0.94) rotate(-1deg); }
      100% { transform: scale(1); }
    }

    .food-emoji {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.68);
      box-shadow: inset 0 -3px 0 rgba(200, 160, 90, 0.1), 0 3px 8px rgba(180, 135, 55, 0.08);
      font-size: 25px;
      line-height: 1;
      transition: transform 0.18s ease;
    }

    .food-btn:hover .food-emoji {
      transform: rotate(-7deg) scale(1.06);
    }

    .food-name {
      position: relative;
      z-index: 1;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.2px;
    }

    .food-tags {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3px;
    }

    .food-tag {
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: inset 0 0 0 1px rgba(205, 170, 110, 0.16);
      color: #9B7542;
      font-size: 9px;
      font-weight: 800;
      white-space: nowrap;
    }

    .food-tag.happy {
      color: #C06986;
    }

    .food-btn[data-food="cake"] {
      --food-tint: #FFF0DC;
      --food-edge: #EFD1A4;
    }

    .food-btn[data-food="icecream"] {
      --food-tint: #EAF7FE;
      --food-edge: #C6E4F0;
    }

    .food-btn[data-food="fruit"] {
      --food-tint: #FFF0F2;
      --food-edge: #F1CDD4;
    }

    .food-btn[data-food="tea"] {
      --food-tint: #F7F0E4;
      --food-edge: #E4D2B6;
    }

    .page-foot {
      padding: 14px 0 2px;
      color: #B79B75;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-align: center;
    }

    /* ===================== 飞行食物 & 粒子层 ===================== */
    .fly-layer,
    .fx-layer {
      position: fixed;
      z-index: 100;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .fly-layer {
      z-index: 110;
    }

    .flying-food {
      position: fixed;
      top: 0;
      left: 0;
      font-size: 30px;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 4px 6px rgba(150, 100, 30, 0.2));
      will-change: transform, opacity;
    }

    .particle {
      position: fixed;
      z-index: 101;
      top: 0;
      left: 0;
      opacity: 0;
      font-size: 14px;
      line-height: 1;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(255, 205, 80, 0.28);
      will-change: transform, opacity;
      animation: particle-fly var(--dur, 0.9s) cubic-bezier(0.16, 0.84, 0.44, 1) forwards;
    }

    .particle.dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--c, #FFC94D);
      box-shadow: 0 0 8px var(--c, #FFC94D);
    }

    @keyframes particle-fly {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.4) rotate(0);
      }
      18% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--x, 0px)), calc(-50% + var(--y, -60px))) scale(0.9) rotate(var(--r, 90deg));
      }
    }

    .confetti {
      position: fixed;
      z-index: 101;
      top: 0;
      left: 0;
      width: 8px;
      height: 12px;
      border-radius: 3px;
      background: var(--c, #FFCB4D);
      opacity: 0;
      pointer-events: none;
      animation: confetti-fall var(--cd, 1.6s) ease-in forwards;
    }

    @keyframes confetti-fall {
      0% {
        opacity: 0;
        transform: translate(0, -12px) rotate(0);
      }
      10% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(var(--cx, 0px), var(--cy, 240px)) rotate(var(--cr, 360deg));
      }
    }

    /* ===================== 响应式 ===================== */
    @media (max-width: 820px) {
      .page {
        width: min(calc(100% - 28px), 680px);
        padding-top: 18px;
      }

      .stage {
        height: clamp(400px, 58vw, 460px);
      }

      .stat-note {
        display: none;
      }

      .stage-tape {
        display: none;
      }

      .food-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }

      .feeding-panel {
        padding: 14px;
      }
    }

    @media (max-width: 560px) {
      .page {
        width: calc(100% - 24px);
        padding-bottom: 22px;
      }

      .brand {
        gap: 10px;
      }

      .brand-mark {
        width: 46px;
        height: 46px;
        border-radius: 16px;
        font-size: 23px;
      }

      .brand-eyebrow {
        font-size: 8px;
        letter-spacing: 1.6px;
      }

      .brand-sub {
        display: none;
      }

      h1 {
        font-size: 24px;
      }

      .reset-btn {
        gap: 5px;
        padding: 9px 13px;
        font-size: 12px;
      }

      .stats {
        gap: 9px;
        margin-bottom: 12px;
      }

      .stat-card {
        padding: 11px 11px 9px;
        border-radius: 18px;
      }

      .stat-name {
        gap: 4px;
        font-size: 11px;
      }

      .stat-icon {
        width: 21px;
        height: 21px;
        border-radius: 7px;
        font-size: 12px;
      }

      .stat-value strong {
        font-size: 21px;
      }

      .stat-value small {
        font-size: 8px;
      }

      .stat-badge {
        padding: 2px 6px;
        font-size: 8.5px;
      }

      .stage {
        height: 410px;
        border-radius: 26px;
      }

      .sun {
        top: 22px;
        right: 22px;
        width: 44px;
        height: 44px;
      }

      .cloud-a {
        top: 94px;
        left: 2%;
        transform: scale(0.72);
      }

      .cloud-b {
        top: 62px;
        right: 8%;
        transform: scale(0.5);
      }

      .bubble {
        top: 16px;
        max-width: calc(100% - 32px);
        padding: 10px 14px;
        border-radius: 16px;
        font-size: 12.5px;
      }

      .pet-zone {
        height: 80%;
        padding-bottom: 26px;
      }

      .pet-rug {
        bottom: 18px;
        height: 40px;
      }

      .pet-shadow {
        bottom: 28px;
      }

      .stage-note {
        display: none;
      }

      .egg-stamp {
        right: 14px;
        bottom: 14px;
        width: 78px;
        height: 78px;
      }

      .egg-stamp strong {
        font-size: 11px;
      }

      .feeding-panel {
        margin-top: 12px;
        padding: 12px;
        border-radius: 22px;
      }

      .panel-head {
        align-items: flex-start;
        flex-direction: column;
        gap: 3px;
        margin-bottom: 10px;
      }

      .panel-hint {
        font-size: 9.5px;
        text-align: left;
      }

      .panel-hint span {
        display: none;
      }

      .food-grid {
        gap: 8px;
      }

      .food-btn {
        padding: 10px 6px 9px;
        border-radius: 17px;
      }

      .food-emoji {
        width: 40px;
        height: 40px;
        border-radius: 13px;
        font-size: 23px;
      }

      .food-name {
        font-size: 12px;
      }

      .food-tag {
        padding: 2px 5px;
        font-size: 8px;
      }

      .page-foot {
        font-size: 9.5px;
      }

      .flying-food {
        font-size: 26px;
      }
    }

    @media (max-width: 380px) {
      h1 {
        font-size: 21px;
      }

      .reset-btn {
        padding: 9px 11px;
      }

      .reset-btn .reset-label {
        display: none;
      }

      .stat-card {
        padding: 10px 9px 8px;
      }

      .stat-name {
        font-size: 10.5px;
      }

      .stat-value strong {
        font-size: 19px;
      }

      .food-tags {
        gap: 2px;
      }
    }

    /* ===================== 降低动效偏好 ===================== */
    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .nailong-stack {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <!-- 背景柔光装饰 -->
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>

  <main class="page">
    <!-- 顶部：标题 + 重置 -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">🍼</div>
        <div class="brand-copy">
          <p class="brand-eyebrow">NAILONG'S LITTLE KITCHEN</p>
          <h1><span class="title-hl">奶龙</span>的小饭桌</h1>
          <p class="brand-sub">喂饱它 · 逗笑它 · 解锁满值小彩蛋</p>
        </div>
      </div>

      <button class="reset-btn" id="resetBtn" type="button" aria-label="重置所有数值并恢复初始表情" title="数值全部归零，恢复初始表情">
        <span class="reset-icon" aria-hidden="true">↺</span>
        <span class="reset-label">重置</span>
      </button>
    </header>

    <!-- 数值面板 -->
    <section class="stats" aria-label="奶龙状态数值">
      <article class="stat-card stat-hunger" id="hungerCard">
        <div class="stat-head">
          <span class="stat-name">
            <span class="stat-icon" aria-hidden="true">🍚</span>
            饥饿值
          </span>
          <span class="stat-value"><strong id="hungerValue">65</strong><small>/100</small></span>
        </div>
        <div class="bar" id="hungerMeter" role="progressbar" aria-label="饥饿值" aria-valuemin="0" aria-valuemax="100" aria-valuenow="65">
          <span class="bar-fill" id="hungerFill"></span>
          <span class="bar-ticks" aria-hidden="true"></span>
        </div>
        <div class="stat-foot">
          <span class="stat-badge" id="hungerBadge">饱饱的</span>
          <span class="stat-note" id="hungerNote">会慢慢变饿哦</span>
        </div>
      </article>

      <article class="stat-card stat-happy" id="happyCard">
        <div class="stat-head">
          <span class="stat-name">
            <span class="stat-icon" aria-hidden="true">💛</span>
            开心值
          </span>
          <span class="stat-value"><strong id="happyValue">55</strong><small>/100</small></span>
        </div>
        <div class="bar" id="happyMeter" role="progressbar" aria-label="开心值" aria-valuemin="0" aria-valuemax="100" aria-valuenow="55">
          <span class="bar-fill" id="happyFill"></span>
          <span class="bar-ticks" aria-hidden="true"></span>
        </div>
        <div class="stat-foot">
          <span class="stat-badge" id="happyBadge">心情不错</span>
          <span class="stat-note" id="happyNote">保持好心情～</span>
        </div>
      </article>
    </section>

    <!-- 奶龙互动舞台 -->
    <section class="stage" id="stage" aria-label="奶龙的互动区域">
      <div class="sun" aria-hidden="true"></div>
      <div class="cloud cloud-a" aria-hidden="true"></div>
      <div class="cloud cloud-b" aria-hidden="true"></div>
      <div class="hill hill-a" aria-hidden="true"></div>
      <div class="hill hill-b" aria-hidden="true"></div>

      <div class="stage-tape" aria-hidden="true">今天的投喂时间</div>

      <div class="egg-stamp" id="eggStamp" aria-hidden="true">
        <span>满值彩蛋</span>
        <strong>捧腹大笑</strong>
      </div>

      <div class="bubble" id="bubble" role="status" aria-live="polite">
        <span id="bubbleText">奶龙今天也想吃好吃的～先喂一口吧！</span>
      </div>

      <div class="pet-zone">
        <div class="pet-rug" aria-hidden="true"></div>
        <div class="pet-shadow" aria-hidden="true"></div>

        <div class="nailong-stack" id="nailongStack">
          <!-- 图片 1：奶龙默认普通表情（页面初始加载展示） -->
          <img
            class="nailong-img is-active"
            data-face="default"
            src="https://img3.pixhost.to/images/7086/803208818_nailong-default.png"
            alt="奶龙普通表情"
            width="302"
            height="448"
            loading="eager"
            decoding="async"
            onerror="this.onerror=null;this.src='assets/nailong-default.png';"
          >

          <!-- 图片 2：奶龙普通开心表情（投喂后短暂展示） -->
          <img
            class="nailong-img"
            data-face="happy"
            src="https://img3.pixhost.to/images/7086/803208823_nailong-happy.png"
            alt="奶龙开心表情"
            width="255"
            height="336"
            loading="eager"
            decoding="async"
            aria-hidden="true"
            onerror="this.onerror=null;this.src='assets/nailong-happy.png';"
          >

          <!-- 图片 3：奶龙委屈饥饿表情（饥饿值和开心值都很低时展示） -->
          <img
            class="nailong-img"
            data-face="hungry"
            src="https://img3.pixhost.to/images/7086/803208832_nailong-hungry.png"
            alt="奶龙委屈饥饿表情"
            width="285"
            height="448"
            loading="eager"
            decoding="async"
            aria-hidden="true"
            onerror="this.onerror=null;this.src='assets/nailong-hungry.png';"
          >

          <!-- 图片 4：奶龙捧腹大笑表情（开心值达到 100 时展示） -->
          <img
            class="nailong-img"
            data-face="laugh"
            src="https://img3.pixhost.to/images/7086/803208841_nailong-laugh.png"
            alt="奶龙捧腹大笑表情"
            width="362"
            height="442"
            loading="eager"
            decoding="async"
            aria-hidden="true"
            onerror="this.onerror=null;this.src='assets/nailong-laugh.png';"
          >
        </div>
      </div>

      <div class="stage-note" aria-hidden="true">
        <span class="stage-note-dot"></span>
        小肚肚会随时间慢慢变空
      </div>
    </section>

    <!-- 底部投喂按钮 -->
    <section class="feeding-panel" aria-label="选择食物投喂奶龙">
      <div class="panel-head">
        <div class="panel-title">
          <p class="panel-kicker">PICK A SNACK</p>
          <h2>今天想喂奶龙吃什么？</h2>
        </div>
        <p class="panel-hint">
          点击食物直接投喂<br>
          <span>等得越久，肚子饿得越快哦</span>
        </p>
      </div>

      <div class="food-grid">
        <button class="food-btn" type="button" data-food="cake" aria-label="投喂草莓蛋糕，饥饿值加20，开心值加12">
          <span class="food-emoji" aria-hidden="true">🍰</span>
          <span class="food-name">草莓蛋糕</span>
          <span class="food-tags">
            <span class="food-tag">饱腹 +20</span>
            <span class="food-tag happy">开心 +12</span>
          </span>
        </button>

        <button class="food-btn" type="button" data-food="icecream" aria-label="投喂冰淇淋，饥饿值加12，开心值加20">
          <span class="food-emoji" aria-hidden="true">🍦</span>
          <span class="food-name">冰淇淋</span>
          <span class="food-tags">
            <span class="food-tag">饱腹 +12</span>
            <span class="food-tag happy">开心 +20</span>
          </span>
        </button>

        <button class="food-btn" type="button" data-food="fruit" aria-label="投喂水果，饥饿值加16，开心值加16">
          <span class="food-emoji" aria-hidden="true">🍓</span>
          <span class="food-name">水果拼盘</span>
          <span class="food-tags">
            <span class="food-tag">饱腹 +16</span>
            <span class="food-tag happy">开心 +16</span>
          </span>
        </button>

        <button class="food-btn" type="button" data-food="tea" aria-label="投喂珍珠奶茶，饥饿值加10，开心值加24">
          <span class="food-emoji" aria-hidden="true">🧋</span>
          <span class="food-name">珍珠奶茶</span>
          <span class="food-tags">
            <span class="food-tag">饱腹 +10</span>
            <span class="food-tag happy">开心 +24</span>
          </span>
        </button>
      </div>
    </section>

    <footer class="page-foot">奶龙说：每一口都要开开心心地吃～</footer>
  </main>

  <!-- 动画图层：飞行食物、闪光粒子、彩纸 -->
  <div class="fly-layer" id="flyLayer" aria-hidden="true"></div>
  <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>

  <script>
    (() => {
      'use strict';

      /* ===================== 数值与规则配置 ===================== */
      const MAX = 100;
      const BASE_HUNGER_DECAY = 0.5;      // 每秒基础饥饿值消耗
      const BASE_HAPPY_DECAY = 0.32;      // 每秒基础开心值消耗
      const HUNGER_ACCEL_AFTER = 12;      // 超过 12 秒没投喂，饥饿值开始加速下降
      const MAX_HUNGER_MULTIPLIER = 2.4;  // 饥饿值下降速度上限
      const LOW_HUNGER = 28;              // 显示低饥饿提醒 / 低值样式
      const VERY_LOW = 25;                // 饥饿值和开心值都低于此值时，展示委屈表情
      const FEED_FACE_MS = 2300;          // 投喂后开心表情持续时间
      const LAUGH_HOLD_MS = 6500;         // 满值彩蛋展示时长
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // 四种食物：增加的饥饿值 / 开心值各不相同
      const FOODS = {
        cake: {
          name: '草莓蛋糕',
          emoji: '🍰',
          hunger: 20,
          happy: 12,
          line: '唔…奶油软乎乎的，奶龙超喜欢！',
          color: '#FFB45C'
        },
        icecream: {
          name: '冰淇淋',
          emoji: '🍦',
          hunger: 12,
          happy: 20,
          line: '冰冰凉凉的！开心得想转圈圈～',
          color: '#8FD3E8'
        },
        fruit: {
          name: '水果拼盘',
          emoji: '🍓',
          hunger: 16,
          happy: 16,
          line: '酸酸甜甜，肚肚和心情都变好啦！',
          color: '#FF8FA8'
        },
        tea: {
          name: '珍珠奶茶',
          emoji: '🧋',
          hunger: 10,
          happy: 24,
          line: '珍珠在嘴里跳舞，快乐值嗖嗖涨！',
          color: '#D8B078'
        }
      };

      const HUNGRY_LINES = [
        '肚肚咕咕叫啦…可以喂喂奶龙吗？',
        '奶龙的小肚子在唱歌，听见了吗～',
        '等了好久啦，想吃一口好吃的…'
      ];

      const SAD_LINES = [
        '呜…肚肚空空的，奶龙好委屈…',
        '又饿又难过，可以抱抱奶龙吗…',
        '奶龙没有力气了，想吃一点点东西…'
      ];

      /* ===================== DOM 引用 ===================== */
      const $ = (selector, root = document) => root.querySelector(selector);
      const stage = $('#stage');
      const nailongStack = $('#nailongStack');
      const bubble = $('#bubble');
      const bubbleText = $('#bubbleText');
      const resetBtn = $('#resetBtn');
      const eggStamp = $('#eggStamp');
      const flyLayer = $('#flyLayer');
      const fxLayer = $('#fxLayer');
      const foodGrid = $('.food-grid');

      const hungerCard = $('#hungerCard');
      const happyCard = $('#happyCard');
      const hungerValue = $('#hungerValue');
      const happyValue = $('#happyValue');
      const hungerFill = $('#hungerFill');
      const happyFill = $('#happyFill');
      const hungerMeter = $('#hungerMeter');
      const happyMeter = $('#happyMeter');
      const hungerBadge = $('#hungerBadge');
      const happyBadge = $('#happyBadge');
      const hungerNote = $('#hungerNote');
      const happyNote = $('#happyNote');

      const faceImages = {
        default: $('.nailong-img[data-face="default"]'),
        happy: $('.nailong-img[data-face="happy"]'),
        hungry: $('.nailong-img[data-face="hungry"]'),
        laugh: $('.nailong-img[data-face="laugh"]')
      };

      /* ===================== 游戏状态 ===================== */
      const state = {
        hunger: 65,
        happy: 55,
        face: 'default',
        lastFeedAt: performance.now(),
        feedingUntil: 0,
        laughUntil: 0,
        resetGraceUntil: 0,
        bubbleActive: false,
        bubbleTimer: 0,
        nextHungryBubbleAt: 0,
        celebrateTimer: 0,
        bounceTimer: 0,
        lastFrameAt: performance.now(),
        lastHudAt: 0,
        hungerRate: 1
      };

      const clamp = (value, min = 0, max = MAX) => Math.min(max, Math.max(min, value));

      /* ===================== 气泡提示 ===================== */
      function showBubble(text, duration = 2800) {
        clearTimeout(state.bubbleTimer);
        bubbleText.textContent = text;
        bubble.classList.remove('show');
        void bubble.offsetWidth; // 强制重排，让气泡每次都重新弹一下
        bubble.classList.add('show');
        state.bubbleActive = true;

        state.bubbleTimer = window.setTimeout(() => {
          bubble.classList.remove('show');
          state.bubbleActive = false;
        }, duration);
      }

      // 饥饿时定时冒泡提醒（不会打断投喂 / 彩蛋气泡）
      function maybeShowHungryBubble(now) {
        if (state.bubbleActive || now < state.nextHungryBubbleAt || now < state.resetGraceUntil) return;
        if (state.hunger > LOW_HUNGER) return;
        if (state.face === 'happy' || state.face === 'laugh') return;

        const isVerySad = state.hunger <= VERY_LOW && state.happy <= VERY_LOW;
        const lines = isVerySad ? SAD_LINES : HUNGRY_LINES;
        const line = lines[Math.floor(Math.random() * lines.length)];
        showBubble(line, 3600);
        state.nextHungryBubbleAt = now + 9000;
      }

      /* ===================== 表情切换 ===================== */
      function applyFace(face) {
        if (state.face === face) return;
        state.face = face;

        Object.keys(faceImages).forEach((key) => {
          const img = faceImages[key];
          const active = key === face;
          img.classList.toggle('is-active', active);
          img.setAttribute('aria-hidden', active ? 'false' : 'true');
        });
      }

      function pickFace(now) {
        // 开心值满值：捧腹大笑（彩蛋优先）
        if (now < state.laughUntil || state.happy >= MAX) return 'laugh';
        // 刚投喂成功：短暂展示普通开心表情
        if (now < state.feedingUntil) return 'happy';
        // 饥饿值和开心值都很低：委屈饥饿表情
        if (now >= state.resetGraceUntil && state.hunger <= VERY_LOW && state.happy <= VERY_LOW) return 'hungry';
        // 其余常态：默认普通表情
        return 'default';
      }

      /* ===================== 数值文字与状态 ===================== */
      function hungerLabel(value) {
        if (value >= 85) return '圆滚滚';
        if (value >= 60) return '饱饱的';
        if (value >= 35) return '有点饿';
        if (value > 5) return '咕咕叫';
        return '饿扁啦';
      }

      function happyLabel(value) {
        if (value >= 100) return '开心满值';
        if (value >= 80) return '超开心';
        if (value >= 55) return '心情不错';
        if (value >= 30) return '想被哄';
        if (value > 5) return '委屈巴巴';
        return '难过极了';
      }

      function updateHUD() {
        const hunger = Math.round(state.hunger);
        const happy = Math.round(state.happy);

        hungerValue.textContent = String(hunger);
        happyValue.textContent = String(happy);
        hungerFill.style.width = `${state.hunger}%`;
        happyFill.style.width = `${state.happy}%`;
        hungerMeter.setAttribute('aria-valuenow', String(hunger));
        happyMeter.setAttribute('aria-valuenow', String(happy));

        hungerCard.classList.toggle('is-low', state.hunger <= LOW_HUNGER);
        happyCard.classList.toggle('is-low', state.happy <= LOW_HUNGER);
        hungerBadge.textContent = hungerLabel(state.hunger);
        happyBadge.textContent = happyLabel(state.happy);

        if (state.hunger <= LOW_HUNGER) {
          hungerNote.textContent = '肚肚在咕咕叫…';
        } else if (state.hungerRate > 1.2) {
          hungerNote.textContent = '正在加速消耗…';
        } else {
          hungerNote.textContent = '会慢慢变饿哦';
        }

        happyNote.textContent = state.happy <= LOW_HUNGER ? '需要哄一哄…' : '保持好心情～';
      }

      // 投喂后在上方飘出 "+xx" 数值提示
      function spawnGain(type, amount) {
        if (amount < 1) return;
        const card = type === 'hunger' ? hungerCard : happyCard;
        const el = document.createElement('span');
        el.className = `gain-pop${type === 'happy' ? ' for-happy' : ''}`;
        el.textContent = `+${Math.round(amount)}`;
        card.appendChild(el);
        window.setTimeout(() => el.remove(), 1000);
      }

      /* ===================== 奶龙小动作 ===================== */
      function bouncePet() {
        nailongStack.classList.remove('is-bouncing');
        void nailongStack.offsetWidth;
        nailongStack.classList.add('is-bouncing');
        clearTimeout(state.bounceTimer);
        state.bounceTimer = window.setTimeout(() => {
          nailongStack.classList.remove('is-bouncing');
        }, 700);
      }

      /* ===================== 食物飞行 & 粒子 ===================== */
      function flyFood(btn, food) {
        const emojiEl = btn.querySelector('.food-emoji');
        if (!emojiEl) return;

        const startRect = emojiEl.getBoundingClientRect();
        const petRect = nailongStack.getBoundingClientRect();
        const x0 = startRect.left + startRect.width / 2;
        const y0 = startRect.top + startRect.height / 2;
        const x1 = petRect.left + petRect.width / 2;
        const y1 = petRect.top + petRect.height * 0.46; // 奶龙嘴巴附近

        if (reducedMotion) {
          sparkleBurst(x1, y1, food.color);
          return;
        }

        const el = document.createElement('span');
        el.className = 'flying-food';
        el.textContent = food.emoji;
        el.style.left = `${x0}px`;
        el.style.top = `${y0}px`;
        flyLayer.appendChild(el);

        const dx = x1 - x0;
        const dy = y1 - y0;
        const lift = Math.min(150, Math.max(60, Math.abs(dy) * 0.3));
        const midX = x0 + dx * 0.55 - Math.sign(dx || 1) * 28;
        const midY = Math.min(y0, y1) - lift;

        const animation = el.animate(
          [
            {
              transform: 'translate(-50%, -50%) scale(0.55) rotate(-12deg)',
              opacity: 0.2
            },
            {
              transform: `translate(calc(-50% + ${midX - x0}px), calc(-50% + ${midY - y0}px)) scale(1.3) rotate(16deg)`,
              opacity: 1,
              offset: 0.55
            },
            {
              transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.22) rotate(-30deg)`,
              opacity: 0.9
            }
          ],
          {
            duration: 720,
            easing: 'cubic-bezier(0.25, 0.7, 0.3, 1)'
          }
        );

        animation.onfinish = () => {
          el.remove();
          sparkleBurst(x1, y1, food.color);
        };
        animation.oncancel = () => el.remove();
      }

      function sparkleBurst(x, y, color = '#FFC94D', amount = 14) {
        if (reducedMotion) return;

        const glyphs = ['✦', '✧', '★', '♥', '•'];
        for (let i = 0; i < amount; i++) {
          const el = document.createElement('span');
          el.className = 'particle';
          const glyph = glyphs[i % glyphs.length];

          if (glyph === '•') {
            el.classList.add('dot');
          } else {
            el.textContent = glyph;
          }

          const angle = Math.random() * Math.PI * 2;
          const distance = 34 + Math.random() * 88;
          el.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
          el.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
          el.style.setProperty('--r', `${(Math.random() * 2 - 1) * 260}deg`);
          el.style.setProperty('--dur', `${0.7 + Math.random() * 0.4}s`);
          el.style.setProperty('--c', color);
          el.style.color = color;
          el.style.left = `${x}px`;
          el.style.top = `${y}px`;
          if (glyph !== '•') el.style.fontSize = `${10 + Math.random() * 12}px`;
          el.style.animationDelay = `${Math.random() * 0.08}s`;

          fxLayer.appendChild(el);
          window.setTimeout(() => el.remove(), 1400);
        }
      }

      function confettiRain() {
        if (reducedMotion) return;

        const rect = stage.getBoundingClientRect();
        const colors = ['#FFCB4D', '#FF9BB6', '#9FE0C4', '#FFB36B', '#FFF0A8'];

        for (let i = 0; i < 26; i++) {
          const el = document.createElement('span');
          el.className = 'confetti';
          el.style.left = `${rect.left + Math.random() * rect.width}px`;
          el.style.top = `${rect.top - 10}px`;
          el.style.setProperty('--c', colors[i % colors.length]);
          el.style.setProperty('--cx', `${(Math.random() * 2 - 1) * 70}px`);
          el.style.setProperty('--cy', `${rect.height * (0.45 + Math.random() * 0.45)}px`);
          el.style.setProperty('--cr', `${Math.random() * 720 - 360}deg`);
          el.style.setProperty('--cd', `${1.2 + Math.random() * 0.8}s`);
          el.style.animationDelay = `${Math.random() * 0.3}s`;
          fxLayer.appendChild(el);
          window.setTimeout(() => el.remove(), 2800);
        }
      }

      // 开心值满 100 的捧腹大笑彩蛋
      function celebrate() {
        const rect = nailongStack.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height * 0.42;

        sparkleBurst(centerX, centerY, '#FFC84A', 20);
        window.setTimeout(() => sparkleBurst(centerX, centerY, '#FF8FB2', 16), 180);
        confettiRain();

        stage.classList.remove('is-celebrating');
        void stage.offsetWidth;
        stage.classList.add('is-celebrating');

        eggStamp.classList.remove('show');
        void eggStamp.offsetWidth;
        eggStamp.classList.add('show');

        showBubble('开心值满 100！奶龙笑到捧腹啦～', 4200);

        clearTimeout(state.celebrateTimer);
        state.celebrateTimer = window.setTimeout(() => {
          stage.classList.remove('is-celebrating');
          eggStamp.classList.remove('show');
        }, 5000);
      }

      /* ===================== 投喂 ===================== */
      function feed(key, btn) {
        const food = FOODS[key];
        if (!food) return;

        const now = performance.now();
        const beforeHunger = state.hunger;
        const beforeHappy = state.happy;

        state.hunger = clamp(state.hunger + food.hunger);
        state.happy = clamp(state.happy + food.happy);
        state.lastFeedAt = now;
        state.resetGraceUntil = 0;
        state.nextHungryBubbleAt = now + 8000;

        const reachedFull = state.happy >= MAX;

        if (reachedFull) {
          // 开心值满 100：立即切到捧腹大笑，并触发彩蛋
          state.feedingUntil = 0;
          state.laughUntil = now + LAUGH_HOLD_MS;
          applyFace('laugh');
        } else {
          // 普通投喂：短暂展示开心表情
          state.feedingUntil = now + FEED_FACE_MS;
          if (now >= state.laughUntil) applyFace('happy');
          showBubble(food.line, 2800);
        }

        bouncePet();
        flyFood(btn, food);
        spawnGain('hunger', state.hunger - beforeHunger);
        spawnGain('happy', state.happy - beforeHappy);

        if (btn) {
          btn.classList.remove('is-feeding');
          void btn.offsetWidth;
          btn.classList.add('is-feeding');
          window.setTimeout(() => btn.classList.remove('is-feeding'), 300);
        }

        if (reachedFull) celebrate();
        updateHUD();
      }

      /* ===================== 重置 ===================== */
      function resetGame() {
        const now = performance.now();

        state.hunger = 0;
        state.happy = 0;
        state.lastFeedAt = now;
        state.feedingUntil = 0;
        state.laughUntil = 0;
        state.resetGraceUntil = now + 2600; // 先保持初始表情一小会儿
        state.nextHungryBubbleAt = now + 5000;
        state.hungerRate = 1;

        clearTimeout(state.celebrateTimer);
        stage.classList.remove('is-celebrating');
        eggStamp.classList.remove('show');

        applyFace('default'); // 表情恢复初始状态
        showBubble('重新开始啦！这次要好好喂奶龙哦～', 2600);
        bouncePet();
        updateHUD();

        resetBtn.classList.remove('is-spinning');
        void resetBtn.offsetWidth;
        resetBtn.classList.add('is-spinning');
        window.setTimeout(() => resetBtn.classList.remove('is-spinning'), 620);
      }

      /* ===================== 主循环：衰减 + 表情 + UI ===================== */
      function frame(now) {
        // 标签页切回来时不要一次性掉太多
        const dt = Math.min(Math.max((now - state.lastFrameAt) / 1000, 0), 1.5);
        state.lastFrameAt = now;

        const idleSeconds = Math.max(0, (now - state.lastFeedAt) / 1000);

        // 长时间不投喂，饥饿值下降速度逐渐加快
        state.hungerRate = idleSeconds > HUNGER_ACCEL_AFTER
          ? Math.min(MAX_HUNGER_MULTIPLIER, 1 + (idleSeconds - HUNGER_ACCEL_AFTER) / 28)
          : 1;

        state.hunger = clamp(state.hunger - BASE_HUNGER_DECAY * state.hungerRate * dt);
        state.happy = clamp(state.happy - BASE_HAPPY_DECAY * dt);

        const nextFace = pickFace(now);
        if (nextFace !== state.face) applyFace(nextFace);

        if (now - state.lastHudAt > 120) {
          updateHUD();
          state.lastHudAt = now;
        }

        maybeShowHungryBubble(now);
        requestAnimationFrame(frame);
      }

      /* ===================== 初始化与事件绑定 ===================== */
      function init() {
        updateHUD();
        showBubble('奶龙今天也想吃好吃的～先喂一口吧！', 3400);

        foodGrid.addEventListener('click', (event) => {
          const btn = event.target.closest('.food-btn');
          if (!btn) return;
          feed(btn.dataset.food, btn);
        });

        resetBtn.addEventListener('click', resetGame);

        document.addEventListener('visibilitychange', () => {
          state.lastFrameAt = performance.now();
          state.lastHudAt = 0;
        });

        requestAnimationFrame((now) => {
          state.lastFrameAt = now;
          requestAnimationFrame(frame);
        });
      }

      init();
    })();
  </script>
</body>
</html>
